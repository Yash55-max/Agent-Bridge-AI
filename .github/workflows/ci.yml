name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt pytest requests
      - name: Start API server
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          echo "waiting for server..."
          for i in {1..20}; do
            if curl -sS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "server up"; break
            fi
            sleep 1
          done
      - name: Run pytest
        run: python -m pytest -q apps/api/tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm --filter @agentbridge/web build
