[project]
name = "agentbridge-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for AgentBridge AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.28.0"]

[tool.uv]
dev-dependencies = ["pytest>=8.0.0", "httpx>=0.28.0"]
